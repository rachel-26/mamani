<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="refresh" content="0; url=signUp.html"/>
    <title>Mamani - Redirecting to Sign Up...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9ff;
            font-family: 'Inter', sans-serif, -apple-system, system-ui;
            color: #003527;
        }
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e1e8fd;
            border-top-color: #006a61;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
        }
    </style>
    <script>
        // Redirect immediately to the sign-up page
        window.location.replace('signUp.html');
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Opening Mamani Sign Up...</p>
    </div>
</body>
</html>
