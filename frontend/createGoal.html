<script src="mamani-api.js"></script>
<script>
        MamaniAPI.requireAuth();
        
        // Handle bottom nav safe area on iOS
        if (CSS.supports('padding-bottom: env(safe-area-inset-bottom)')) {
            document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
            document.documentElement.style.setProperty('--sab', 'env(safe-area-bottom)');
        }
        
        const form = document.getElementById('create-goal-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('create-goal-btn');
            
            const title = document.getElementById('goal-title').value;
            const target_date = document.getElementById('goal-target-date').value;
            const target_amount = parseFloat(document.getElementById('goal-amount').value);
            
            if (!title || !target_date || isNaN(target_amount)) return;
            
            try {
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...';
                btn.disabled = true;
                
                await MamaniAPI.createGoal({
                    title: title,
                    target_amount: target_amount,
                    target_date: new Date(target_date).toISOString(),
                    is_short_term: true,
                    color_index: Math.floor(Math.random() * 4), // Assign a random color index
                    image_url: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBuwl6TQGNX2sfT1h8TwFIR1kDsidCNU3NYlFSI0HYbg-Q2o28beqyIRFBQ4Hv_XQK-JziTkE5AGuvnWOrXcbJNbGl-D6GMUEJNGNF5YyB2UedbdmXlRmR6xtgxX8N1xtUOgJdlcgQfgmGuiZ6EGW17bZvMPpq5-OBsSpKUOZBx7IA1dh59UHixuW0S71Sp4KlaXNAzNIYHzoPtty6vzg6W82QoEwdolgG9oSofCqrz3KjFrCikR1y2Mg'
                });
                
                window.location.href = 'tracking.html';
            } catch (err) {
                alert('Failed to create goal: ' + err.message);
                btn.innerHTML = '<span class="material-symbols-outlined">rocket_launch</span> Set Goal';
                btn.disabled = false;
            }
        });
    </script>
